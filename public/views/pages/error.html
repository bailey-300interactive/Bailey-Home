{% extends session.authenticated ? "bases/base-admin.html" : "bases/base.html" %}
{% block title %}{{ data.error_title }}{% endblock %}
{% block body %}
<div class="text-center py-5" style="max-width:480px;margin:0 auto">
    <div style="font-size:3rem">🧭</div>
    <h1 class="h3 mt-2">{{ data.error_title }}</h1>
    <p class="text-muted">{{ data.error_message }}</p>
    <a href="/" class="btn btn-primary">Back to the dashboard</a>
</div>
{% endblock %}
