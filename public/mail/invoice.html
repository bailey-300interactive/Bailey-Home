{{ header|raw }}
<p style="white-space:pre-line;margin:0 0 22px;line-height:1.55">{{ data.message }}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fa;border-radius:12px;margin-bottom:22px"><tr><td style="padding:18px 20px">
    <div style="color:#8a939c;font-size:12px;text-transform:uppercase;letter-spacing:.06em">Invoice {{ data.number }}</div>
    <div style="font-size:26px;font-weight:700;margin:4px 0">{{ data.total }}</div>
    <div style="color:#495057;font-size:14px">Due {{ data.due }}</div>
</td></tr></table>
<a href="{{ data.url }}" style="display:inline-block;background:#3b7ddd;color:#fff;text-decoration:none;padding:11px 20px;border-radius:9px;font-weight:600">View invoice</a>
{{ footer|raw }}
